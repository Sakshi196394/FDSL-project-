# ===================================================================
# Hotel Vahinisaheb - Spring Boot Application Configuration
# ===================================================================

# Application Info
spring.application.name=hotel-vahinisaheb-backend
server.port=8080

# Database Configuration (MySQL placeholders)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_vahinisaheb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JSON and Validation Settings
spring.jackson.deserialization.fail-on-unknown-properties=false
